# Configures the whole GitLab HA cluster. Order matters: each layer needs the
# one before it to be up.
#
#   ansible-playbook site.yml
#
# Safe to re-run: every role is idempotent.

- name: Load cluster secrets from AWS Secrets Manager (on your machine)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read the GitLab secret written by Terraform
      ansible.builtin.set_fact:
        gitlab_secrets: "{{ lookup('amazon.aws.secretsmanager_secret', hostvars[groups['all'][0]].gitlab_secret_arn, region=hostvars[groups['all'][0]].aws_region) | from_json }}"
      no_log: true

- name: Base setup on every node
  hosts: all
  become: true
  roles:
    - common

- name: Consul servers (Patroni's leader-election store)
  hosts: consul
  become: true
  roles:
    - role: consul
      vars:
        consul_server: true

- name: PostgreSQL 3-node cluster managed by Patroni
  hosts: postgres
  become: true
  roles:
    - role: consul # local Consul agent that Patroni talks to
      vars:
        consul_server: false
    - postgres

- name: Redis primary/replicas + Sentinel
  hosts: redis
  become: true
  roles:
    - redis

# The GitLab CE (Omnibus) nodes. serial [1, 100%]: the first host goes alone,
# the rest follow in parallel. The first Gitaly node generates
# gitlab-secrets.json, which every later node receives; the first Praefect and
# Rails nodes run the database migrations.
- name: Gitaly storage nodes
  hosts: gitaly
  become: true
  serial: [1, "100%"]
  roles:
    - role: gitlab_omnibus
      vars:
        gitlab_rb_template: gitaly.rb.j2

- name: Praefect (Gitaly Cluster router)
  hosts: praefect
  become: true
  serial: [1, "100%"]
  roles:
    - role: gitlab_omnibus
      vars:
        gitlab_rb_template: praefect.rb.j2

- name: GitLab Rails (web, API, Git over HTTPS/SSH)
  hosts: rails
  become: true
  serial: [1, "100%"]
  roles:
    - role: gitlab_omnibus
      vars:
        gitlab_rb_template: rails.rb.j2

- name: Sidekiq (background jobs)
  hosts: sidekiq
  become: true
  roles:
    - role: gitlab_omnibus
      vars:
        gitlab_rb_template: sidekiq.rb.j2

- name: Application settings, daily backup, runner token
  hosts: rails[0]
  become: true
  roles:
    - gitlab_post

- name: GitLab Runners (Docker executor)
  hosts: runner
  become: true
  roles:
    - runner

- name: Prometheus + Grafana
  hosts: monitoring
  become: true
  roles:
    - monitoring
