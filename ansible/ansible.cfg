# Run from this folder. On WSL with the repo under /mnt/..., Ansible ignores a
# config file in a world-writable directory, so point at it explicitly:
#   export ANSIBLE_CONFIG=$PWD/ansible.cfg
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = ubuntu
forks = 30
interpreter_python = auto_silent
callback_result_format = yaml
# Private IPs reached over the VPN, recreated on every rebuild, and the Rails
# nodes switch to the shared Git SSH host key: known_hosts would only get in the way.
host_key_checking = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30
