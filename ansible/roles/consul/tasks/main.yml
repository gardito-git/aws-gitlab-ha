- name: HashiCorp apt repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: deb
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: https://apt.releases.hashicorp.com/gpg

- name: Install Consul
  ansible.builtin.apt:
    name: consul
    update_cache: true

- name: Consul configuration
  ansible.builtin.template:
    src: consul.hcl.j2
    dest: /etc/consul.d/consul.hcl
    owner: consul
    group: consul
    mode: "0640"
  notify: Restart consul

- name: Start Consul
  ansible.builtin.systemd_service:
    name: consul
    enabled: true
    state: started

- name: Apply config changes now
  ansible.builtin.meta: flush_handlers

- name: Wait until the Consul cluster has elected a leader
  ansible.builtin.uri:
    url: http://127.0.0.1:8500/v1/status/leader
    return_content: true
  register: consul_leader
  until: consul_leader.status == 200 and (consul_leader.json | default('')) | length > 0
  retries: 30
  delay: 5
