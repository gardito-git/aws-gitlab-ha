- name: Wait for cloud-init to finish (it holds the apt lock on first boot)
  ansible.builtin.command: cloud-init status --wait
  register: cloud_init
  changed_when: false
  failed_when: cloud_init.rc not in [0, 2] # 2 = finished with recoverable warnings

- name: Base packages
  ansible.builtin.apt:
    name: [curl, ca-certificates, gnupg, jq, python3-venv]
    update_cache: true
    cache_valid_time: 3600

- name: Use UTC (the 00:00 backup schedule relies on it)
  community.general.timezone:
    name: Etc/UTC

- name: Trust the GitLab CA system-wide (self-signed certificate only)
  ansible.builtin.copy:
    content: "{{ gitlab_ca_cert }}"
    dest: /usr/local/share/ca-certificates/gitlab-ca.crt
    mode: "0644"
  when: gitlab_ca_cert | length > 0
  notify: Update CA certificates

# The GitLab package brings its own node_exporter on Omnibus nodes.
- name: node_exporter for Prometheus
  ansible.builtin.apt:
    name: prometheus-node-exporter
  when: inventory_hostname not in groups['gitlab_omnibus']
