# Settings you may change. Terraform writes the infrastructure facts next to
# this file (terraform.yml); passwords come from AWS Secrets Manager.

# GitLab CE package version on every Omnibus node, e.g. "18.6.0-ce.0".
# Empty = newest. Pin it once the cluster is up so all nodes stay identical.
gitlab_version: ""

postgres_version: 17
patroni_pip_spec: "patroni[consul,psycopg3]>=4.0,<5"
postgres_max_connections: 500

redis_master_name: gitlab-redis

runner_concurrent: 4               # jobs at once per runner (c8i.xlarge = 4 vCPU)
runner_default_image: alpine:latest
runner_tags: [docker, aws]

# Daily gitlab-backup at 00:00 UTC (nodes run in UTC) on the first Rails node.
backup_cron_hour: "0"
backup_cron_minute: "0"

# Loaded once per run by the first play of site.yml.
secrets: "{{ hostvars['localhost'].gitlab_secrets }}"

monitoring_ip: "{{ hostvars[groups['monitoring'][0]].private_ip }}"
